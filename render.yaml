services:
  - type: web
    name: code-manager
    runtime: node
    plan: free
    # --include=dev is required: NODE_ENV=production (below) is applied during
    # the build as well as at runtime, and npm then skips devDependencies —
    # which is where vite lives, so `npm run build` exited 127 (vite: not
    # found). The server install deliberately omits its own devDependencies
    # (jest, nodemon, supertest), which the build and runtime don't need.
    buildCommand: npm install --include=dev && cd server && npm install && cd .. && npm run build
    startCommand: NODE_ENV=production node server/server.js
    # Render restarts the service if this stops returning 2xx.
    healthCheckPath: /api/health
    envVars:
      - key: NODE_ENV
        value: production
      - key: JWT_SECRET
        sync: false
      - key: MONGODB_URI
        sync: false
      - key: CORS_ORIGIN
        sync: false
      # SMTP — required to deliver verification & password-reset emails.
      # Values are entered in the Render dashboard (sync: false = not committed).
      - key: SMTP_HOST
        sync: false
      - key: SMTP_PORT
        sync: false
      - key: SMTP_SECURE
        sync: false
      - key: SMTP_USER
        sync: false
      - key: SMTP_PASS
        sync: false
      - key: EMAIL_FROM
        sync: false
