services:
  - type: web
    name: code-manager
    runtime: node
    plan: free
    buildCommand: npm install && cd server && npm install && cd .. && npm run build
    startCommand: NODE_ENV=production node server/server.js
    envVars:
      - key: NODE_ENV
        value: production
      - key: JWT_SECRET
        sync: false
      - key: MONGODB_URI
        sync: false
      - key: CORS_ORIGIN
        sync: false
      # SMTP — required to deliver verification & password-reset emails.
      # Values are entered in the Render dashboard (sync: false = not committed).
      - key: SMTP_HOST
        sync: false
      - key: SMTP_PORT
        sync: false
      - key: SMTP_SECURE
        sync: false
      - key: SMTP_USER
        sync: false
      - key: SMTP_PASS
        sync: false
      - key: EMAIL_FROM
        sync: false
